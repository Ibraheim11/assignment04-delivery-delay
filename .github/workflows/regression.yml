name: Regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/work/regression-airflow
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:///${{ github.workspace }}/work/regression-airflow/airflow.db
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      RUN_AIRFLOW_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned Airflow and project dependencies
        run: |
          python -m pip install 'apache-airflow==3.1.0' --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.1.0/constraints-3.12.txt
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Prepare isolated development metadata database
        run: |
          airflow db migrate
          airflow dags reserialize
      - name: Run complete regression suite
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee work/regression-tests.log
      - name: Audit original data, examples, saved predictions and repository hygiene
        run: python -m scripts.audit_submission --output work/submission-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/regression-tests.log
            work/submission-audit.json
          if-no-files-found: warn
          retention-days: 14
